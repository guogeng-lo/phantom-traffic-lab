<title>幽靈塞車風格樣本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Chiron+Hei+HK:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@500;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* 外框：標題列和分頁，跟著讀者的深淺色設定；三種風格各自固定一套配色（風格本身就是比較的對象） */
:root {
  --chrome-bg: #eef1f4; --chrome-fg: #18212b; --chrome-muted: #55626f; --chrome-line: #c9d1d9; --chrome-tab: #ffffff; --chrome-on: #18212b; --chrome-on-fg: #ffffff;
  --cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chrome-bg: #11161c; --chrome-fg: #e6ebf0; --chrome-muted: #9aa7b4; --chrome-line: #2b3540; --chrome-tab: #1a222b; --chrome-on: #e6ebf0; --chrome-on-fg: #11161c; color-scheme: dark } }
:root[data-theme="dark"] { --chrome-bg: #11161c; --chrome-fg: #e6ebf0; --chrome-muted: #9aa7b4; --chrome-line: #2b3540; --chrome-tab: #1a222b; --chrome-on: #e6ebf0; --chrome-on-fg: #11161c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--chrome-bg); color: var(--chrome-fg); font-family: var(--cjk); font-size: 17px; line-height: 1.6 }
.chrome { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 14px; max-width: 1280px; margin: 0 auto }
.chrome .kicker { margin: 0; font-size: 14px; letter-spacing: .08em; color: var(--chrome-muted) }
.chrome h1 { margin: 4px 0 6px; font-size: clamp(24px, 4vw, 34px); font-weight: 900; text-wrap: balance }
.chrome p.note { margin: 0 0 14px; max-width: 70ch; color: var(--chrome-muted); font-size: 16px }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.tab { appearance: none; border: 2px solid var(--chrome-line); background: var(--chrome-tab); color: var(--chrome-fg); border-radius: 10px; padding: 10px 12px; text-align: left; font: inherit; cursor: pointer; min-width: 0 }
.tab b { display: block; font-size: 18px }
.tab span { display: block; font-size: 14px; color: var(--chrome-muted); line-height: 1.4 }
.tab[aria-selected="true"] { background: var(--chrome-on); color: var(--chrome-on-fg); border-color: var(--chrome-on) }
.tab[aria-selected="true"] span { color: inherit; opacity: .8 }
.tab:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px }
@media (max-width: 640px) { .tabs { grid-template-columns: 1fr } .tab span { display: none } }

/* 共同：投影片外框、互動元件 */
.slide { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px }
.slide-in { max-width: 1280px; margin: 0 auto; display: grid; gap: 18px }
.ring-svg { width: 100%; height: auto; display: block; touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none }
.ring-svg:focus { outline: none }
.ring-svg:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px }
.ts-wrap { position: relative; width: 100% }
.ts-canvas { width: 100%; display: block }
.btn { appearance: none; font: inherit; cursor: pointer; border-radius: 8px; padding: 10px 16px; min-height: 44px }
.btn[disabled] { opacity: .45; cursor: default }
.opts { display: grid; gap: 8px }
details.src summary { cursor: pointer; font-weight: 700; list-style: none }
details.src summary::-webkit-details-marker { display: none }
details.src ul { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px }
details.src li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
details.src code { font-size: 14px; word-break: break-all }
.hide { display: none !important }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

/* ========== A：互動科學館 ========== */
/* 版面：每頁一張大展板，左邊大型環道佔滿，右邊是操作台；標題一句重點 */
.sa {
  --bg: #e8f0f4; --panel: #ffffff; --ink: #14232f; --muted: #4f6372; --line: #cfdde6; --act: #0a6e78; --act-ink: #ffffff;
  --road: #dbe5ec; --road-mid: #ffffff;
  --exp: #1d8a4c; --mod: #6b4fc8; --sim: #14232f; --der: #9a5b00;
  --f-cjk: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --f-num: "Outfit", "Chiron GoRound TC", sans-serif;
  background: var(--bg); color: var(--ink); font-family: var(--f-cjk)
}
.sa .slide-in { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start }
.sa .head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px }
.sa .pgno { font-family: var(--f-num); font-weight: 700; font-size: 18px; color: var(--muted) }
.sa h2 { margin: 0; font-size: clamp(30px, 5vw, 52px); font-weight: 800; line-height: 1.15; text-wrap: balance; flex-basis: 100% }
.sa .stage { background: var(--panel); border-radius: 28px; padding: 14px; box-shadow: 0 10px 30px rgba(20, 60, 80, .10); min-width: 0 }
.sa .desk { display: grid; gap: 14px; min-width: 0 }
.sa .tile { background: var(--panel); border-radius: 20px; padding: 16px 18px; min-width: 0 }
.sa .clock { font-family: var(--f-num); font-weight: 700; font-size: clamp(40px, 6vw, 60px); line-height: 1; font-variant-numeric: tabular-nums }
.sa .clock-l { font-size: 15px; color: var(--muted) }
.sa .say { font-size: clamp(20px, 2.4vw, 26px); font-weight: 600; line-height: 1.45; margin: 0 }
.sa .tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; padding: 2px 12px; border-radius: 999px; color: #fff; white-space: nowrap }
.sa .tag.exp { background: var(--exp) } .sa .tag.mod { background: var(--mod) } .sa .tag.sim { background: var(--sim) } .sa .tag.der { background: var(--der) }
.sa .btn { background: var(--act); color: var(--act-ink); border: 0; font-weight: 800; font-size: 18px; border-radius: 14px }
.sa .btn.ghost { background: transparent; color: var(--act); border: 2px solid var(--act) }
.sa .row { display: flex; flex-wrap: wrap; gap: 10px }
.sa .legend { display: grid; gap: 6px; font-size: 16px }
.sa .legend i { display: inline-block; width: 26px; height: 14px; border-radius: 7px; vertical-align: middle; margin-right: 8px; border: 1px solid rgba(0,0,0,.25) }
.sa .fine { font-size: 15px; color: var(--muted); margin: 0 }
.sa .opts .btn { text-align: left; background: #f0f6f8; color: var(--ink); border: 2px solid var(--line) }
.sa .opts .btn.chosen { border-color: var(--act); background: #dff1f2 }
.sa details.src { background: var(--panel); border-radius: 16px; padding: 12px 16px; grid-column: 1 / -1 }
.sa .text { grid-column: 1 / -1; display: grid; gap: 10px }
.sa .text p { margin: 0; font-size: 19px; max-width: 75ch }
@media (max-width: 760px) { .sa .slide-in { grid-template-columns: 1fr } .sa .stage { border-radius: 20px; padding: 8px } }

/* ========== B：交通觀測室 ========== */
/* 版面：監控室儀表板，上方一條即時讀數，下面兩塊大儀表（環道、時空圖），文字縮在側欄 */
.sb {
  --bg: #08131f; --panel: #0e1f31; --panel2: #12283f; --ink: #dbe8f4; --muted: #8aa1b8; --line: #1f3b57; --act: #e6eef6; --act-ink: #08131f;
  --road: #16324d; --road-tick: #2c5276;
  --exp: #4fd18b; --mod: #c39bff; --sim: #e6eef6; --der: #ffc46b;
  --f-cjk: "Chiron Hei HK", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  background: var(--bg); color: var(--ink); font-family: var(--f-cjk)
}
.sb .slide { border-top: 1px solid var(--line) }
.sb .slide-in { grid-template-columns: minmax(0, 1fr) minmax(0, 340px) }
.sb .bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; font-family: var(--f-mono); color: var(--muted); font-size: 14px; letter-spacing: .06em }
.sb .bar b { color: var(--ink); font-weight: 600 }
.sb h2 { grid-column: 1 / -1; margin: 0; font-size: clamp(28px, 4.4vw, 46px); font-weight: 800; line-height: 1.2; text-wrap: balance }
.sb .stage { background: radial-gradient(circle at 50% 50%, #10263c 0%, var(--panel) 70%); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; position: relative }
.sb .stage .corner { position: absolute; top: 10px; left: 12px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); letter-spacing: .08em }
.sb .side { display: grid; gap: 12px; align-content: start; min-width: 0 }
.sb .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0 }
.sb .clock { font-family: var(--f-mono); font-weight: 600; font-size: clamp(38px, 5vw, 54px); line-height: 1; font-variant-numeric: tabular-nums; color: #ffffff }
.sb .clock-l { font-family: var(--f-mono); font-size: 13px; color: var(--muted); letter-spacing: .06em }
.sb .say { font-size: 21px; font-weight: 600; line-height: 1.45; margin: 0 }
.sb .tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-weight: 600; font-size: 13px; letter-spacing: .04em; padding: 2px 10px; border: 1px solid currentColor; border-radius: 3px; white-space: nowrap }
.sb .tag.exp { color: var(--exp) } .sb .tag.mod { color: var(--mod) } .sb .tag.sim { color: var(--sim) } .sb .tag.der { color: var(--der) }
.sb .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.sb .btn { background: var(--act); color: var(--act-ink); border: 0; font-weight: 700; font-size: 17px; border-radius: 4px }
.sb .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--muted) }
.sb .row { display: flex; flex-wrap: wrap; gap: 8px }
.sb .legend { display: grid; gap: 6px; font-size: 15px }
.sb .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 8px; box-shadow: 0 0 8px currentColor }
.sb .fine { font-size: 14px; color: var(--muted); margin: 0 }
.sb .opts .btn { text-align: left; background: var(--panel2); color: var(--ink); border: 1px solid var(--line) }
.sb .opts .btn.chosen { border-color: #ffffff }
.sb details.src { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 6px; padding: 10px 14px; font-size: 15px }
.sb .text p { margin: 0; font-size: 18px }
.sb .text { display: grid; gap: 8px }
@media (max-width: 860px) { .sb .slide-in { grid-template-columns: 1fr } }

/* ========== C：現代資訊圖鑑 ========== */
/* 版面：12欄網格的圖鑑頁，超大標題壓在左上，圖表佔大面積；顏色只用來表示車速，證據種類用圖樣區分 */
.sc {
  --bg: #fbfbfa; --ink: #111111; --muted: #4a4a4a; --line: #111111; --soft: #ececea;
  --act: #111111; --act-ink: #fbfbfa;
  --f-cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --f-num: "Unbounded", "Noto Sans TC", sans-serif;
  background: var(--bg); color: var(--ink); font-family: var(--f-cjk)
}
.sc .slide { border-bottom: 6px solid var(--ink) }
.sc .slide-in { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px 22px }
.sc .pgno { grid-column: span 12; font-family: var(--f-num); font-weight: 800; font-size: 15px; letter-spacing: .1em; display: flex; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 6px }
.sc h2 { grid-column: span 12; margin: 0; font-size: clamp(34px, 6.4vw, 76px); font-weight: 900; line-height: 1.05; letter-spacing: -.01em; text-wrap: balance }
.sc .stage { grid-column: span 7; min-width: 0 }
.sc .side { grid-column: span 5; display: grid; gap: 16px; align-content: start; min-width: 0 }
.sc .big { font-family: var(--f-num); font-weight: 800; font-size: clamp(44px, 7vw, 84px); line-height: .95; font-variant-numeric: tabular-nums }
.sc .big-l { font-size: 16px; font-weight: 700; border-top: 2px solid var(--ink); padding-top: 6px; margin-top: 6px }
.sc .say { font-size: clamp(20px, 2.3vw, 26px); font-weight: 700; line-height: 1.4; margin: 0 }
.sc .tag { display: inline-flex; align-items: center; font-weight: 900; font-size: 15px; padding: 1px 10px; border: 2px solid var(--ink); white-space: nowrap }
.sc .tag.exp { background: var(--ink); color: var(--bg) }
.sc .tag.mod { background: var(--bg); color: var(--ink) }
.sc .tag.sim { background: repeating-linear-gradient(135deg, var(--soft) 0 4px, var(--bg) 4px 8px); color: var(--ink) }
.sc .tag.der { border-style: dashed }
.sc .btn { background: var(--act); color: var(--act-ink); border: 2px solid var(--ink); font-weight: 900; font-size: 18px; border-radius: 0 }
.sc .btn.ghost { background: var(--bg); color: var(--ink) }
.sc .row { display: flex; flex-wrap: wrap; gap: 10px }
.sc .legend { display: grid; gap: 4px; font-size: 16px; font-weight: 700 }
.sc .legend i { display: inline-block; width: 36px; height: 12px; vertical-align: middle; margin-right: 10px }
.sc .fine { font-size: 15px; color: var(--muted); margin: 0 }
.sc .opts .btn { text-align: left; background: var(--bg); color: var(--ink) }
.sc .opts .btn.chosen { background: var(--ink); color: var(--bg) }
.sc details.src { grid-column: span 12; border-top: 2px solid var(--ink); padding-top: 10px }
.sc .text { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 28px }
.sc .text p { margin: 0; font-size: 18px; border-left: 6px solid var(--ink); padding-left: 12px }
@media (max-width: 860px) { .sc .stage, .sc .side { grid-column: span 12 } }
</style>

<header class="chrome">
  <p class="kicker">節點7｜視覺風格樣本（還沒選定）</p>
  <h1>同一段內容，三種視覺語言</h1>
  <p class="note">三個分頁都放第2頁的22台車環道和第3頁的時空圖，文字和資料完全一樣，只有色彩、字體、排版、車子和控制元件不同。車子的位置來自Python參考模型事先算好的資料（點擊後0到400模型時間），不是正式的瀏覽器模擬。</p>
  <div class="tabs" role="tablist" aria-label="風格">
    <button class="tab" role="tab" id="tab-a" data-style="a" aria-selected="true"><b>A　互動科學館</b><span>明亮、圓潤、像展覽的展板</span></button>
    <button class="tab" role="tab" id="tab-b" data-style="b" aria-selected="false"><b>B　交通觀測室</b><span>深色儀表板，車流和時空圖像監控畫面</span></button>
    <button class="tab" role="tab" id="tab-c" data-style="c" aria-selected="false"><b>C　現代資訊圖鑑</b><span>網格、大字、顏色只表示車速</span></button>
  </div>
</header>
<main id="main"></main>

<script src="sample-data.js"></script>
<script>
(() => {
  const S = window.SAMPLE;
  const N = S.N, L = S.L, B = L / N, VB = S.vb, EV = S.every, FR = S.d.length, SMAX = (FR - 1) * EV;
  const RATE = 6;            // 播放速度：每秒6個模型時間（逐頁稿第1、2頁的顯示設定）
  const TS_RATE = 16;        // 時空圖逐步畫一台車：每秒16個模型時間
  // 時空圖畫的時間範圍（顯示設定）：塞車團開始被追蹤（至少3台相鄰的車速度低於0.1）之前50開始，畫110模型時間。
  // 樣本第一版畫了點擊後0～400，每台車繞了9圈，線幾乎是水平的，看不出方向，所以縮短。
  const TS_S0 = Math.max(0, Math.round((S.track[0][0] - 50) / EV) * EV), TS_S1 = Math.min(SMAX, TS_S0 + 110);
  // 先畫的那一台：塞車團開始被追蹤的那一刻，速度最低的車（資料裡的編號，點第j台時要轉j格）
  const HL = (() => { const k = Math.round(S.track[0][0] / EV); let m = 0; for (let n = 1; n < N; n++) if (S.v[k][n] < S.v[k][m]) m = n; return m; })();
  const K0 = Math.round(TS_S0 / EV), K1 = Math.round(TS_S1 / EV);
  const JAM_V = 0.1;         // 「幾乎停住」：model/CRITERIA.md的門檻

  // ---------- 三種風格的設定：顏色的意思三套都一樣，只換色票 ----------
  const STYLES = {
    a: { speed: ["#e0452b", "#c3ccd4", "#2563d9"], ink: "#14232f", muted: "#4f6372", grid: "#dfe8ee", tsBg: "#ffffff", jamArrow: "#e0452b", car: "pill", road: "#dbe5ec", roadMid: "#ffffff", label: "#14232f", font: '"Chiron GoRound TC","Noto Sans TC",sans-serif', num: '"Outfit","Chiron GoRound TC",sans-serif' },
    b: { speed: ["#ff5d73", "#6f839a", "#38bdf8"], ink: "#dbe8f4", muted: "#8aa1b8", grid: "#173049", tsBg: "#0b1a2a", jamArrow: "#ff5d73", car: "dot", road: "#16324d", roadMid: "#2c5276", label: "#ffffff", font: '"Chiron Hei HK","Noto Sans TC",sans-serif', num: '"IBM Plex Mono",monospace' },
    c: { speed: ["#e8412c", "#bdbdbb", "#1f4fe0"], ink: "#111111", muted: "#4a4a4a", grid: "#e2e2df", tsBg: "#fbfbfa", jamArrow: "#e8412c", car: "bar", road: "#111111", roadMid: "#111111", label: "#111111", font: '"Noto Sans TC",sans-serif', num: '"Unbounded","Noto Sans TC",sans-serif' }
  };

  // ---------- 內容：三種風格共用同一份文字（取自pipeline/pages/p02.md、p03.md） ----------
  const SRC2 = [["sim", "ours-model-click-brake"], ["mod", "bando1995-ovm-equation"], ["mod", "bando1995-velocity-function"], ["mod", "bando1995-spontaneous-jam"], ["exp", "sugiyama2008-jam-emerges"]];
  const SRC3 = [["exp", "sugiyama2008-setup"], ["exp", "sugiyama2008-backward-wave"], ["exp", "tadaki2013-density-dependence"], ["mod", "bando1995-spontaneous-jam"], ["sim", "ours-model-wave-direction"]];
  const TAGNAME = { exp: "實驗", mod: "模型", sim: "我們的模擬", der: "我們的推導" };
  const tag = k => `<span class="tag ${k}">${TAGNAME[k]}</span>`;
  const srcBox = list => `<details class="src"><summary>出處（${list.length}張證據卡）</summary><ul>${list.map(([k, id]) => `<li>${tag(k)}<code>${id}</code></li>`).join("")}</ul><p class="fine">檢查狀態：這是風格樣本，還沒接上檢查報告，所以這裡不顯示任何檢查結果。正式版由建置程式從slide-map、證據卡和runs/的報告產生。</p></details>`;
  const legend = st => `<div class="legend" aria-label="顏色的意思">
      <div><i style="background:${st.speed[0]};color:${st.speed[0]}"></i>幾乎停住（車速低於0.1）</div>
      <div><i style="background:${st.speed[1]};color:${st.speed[1]}"></i>均勻車流的速度</div>
      <div><i style="background:${st.speed[2]};color:${st.speed[2]}"></i>比均勻車流快</div></div>`;
  const TIME_NOTE = "動畫已加速。模型時間沒有單位，不是秒。";
  const P2_TEXT = [`${tag("sim")} 在這組條件下，輕踩煞車造成的小擾動逐漸放大，最後形成塞車。這是這組模擬裡的事，條件不同時，同樣的煞車不一定會塞。`,
                   `${tag("exp")} 真實實驗沒有說是誰踩了煞車，它看到的是車距的小波動自然出現、慢慢變大。`];
  const P3_ONE = "每一條線是一台車。往右下斜是在往前開；幾乎直直往下，是幾乎停住了。";

  // ---------- 主迴圈 ----------
  function tick(ts0) {

        ts.mode = "one"; ts.prog = TS_S0; b.disabled = true; root.querySelector('[data-act="ts-all"]').disabled = true;

  }

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { if (location.hash !== "#" + t.dataset.style) location.hash = t.dataset.style; else mount(t.dataset.style); }));
  const fromHash = () => { const k = (location.hash || "#a").slice(1); mount(STYLES[k] ? k : "a"); };
  window.addEventListener("hashchange", fromHash);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { ts.dirty = true; }, 120); });

})();
