<style>
/* 外框（標題和分頁）跟讀者的深淺色設定；三種風格各自固定一套配色，因為風格本身就是比較的對象。設計計畫見DESIGN.md */
:root {
  --ch-bg: #e9ecef; --ch-fg: #1d242b; --ch-muted: #56616c; --ch-line: #c4ccd3; --ch-tab: #f8f9fa; --ch-on: #1d242b; --ch-on-fg: #f8f9fa;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ch-bg: #161b20; --ch-fg: #e3e8ec; --ch-muted: #9aa5af; --ch-line: #2c343c; --ch-tab: #1e252c; --ch-on: #e3e8ec; --ch-on-fg: #161b20; color-scheme: dark } }
:root[data-theme="dark"] { --ch-bg: #161b20; --ch-fg: #e3e8ec; --ch-muted: #9aa5af; --ch-line: #2c343c; --ch-tab: #1e252c; --ch-on: #e3e8ec; --ch-on-fg: #161b20; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--ch-bg); color: var(--ch-fg); font-family: var(--cjk); font-size: 18px; line-height: 1.6 }
.chrome { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 16px; max-width: 1320px; margin: 0 auto }
.chrome h1 { margin: 0 0 6px; font-size: clamp(24px, 3.6vw, 32px); font-weight: 900; text-wrap: balance }
.chrome p { margin: 0 0 14px; max-width: 72ch; color: var(--ch-muted); font-size: 16px }
.tabs { display: flex; flex-wrap: wrap; gap: 8px }
.tab { appearance: none; border: 2px solid var(--ch-line); background: var(--ch-tab); color: var(--ch-fg); border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; min-height: 44px }
.tab[aria-selected="true"] { background: var(--ch-on); color: var(--ch-on-fg); border-color: var(--ch-on) }
button:focus-visible, summary:focus-visible, canvas:focus-visible { outline: 3px solid #e8a400; outline-offset: 3px }
.hide { display: none !important }
canvas { display: block; max-width: 100% }

@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ================= A 互動科學館：展場牆面、一塊說明牌、黃色實體按鈕 ================= */
.sa { --wall: #eef2ec; --card: #ffffff; --ink: #1f2d27; --soft: #56645d; --act: #ffc21a; --act-d: #c9930a;
  --head: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--wall); color: var(--ink); font-family: var(--cjk) }
.sa .page { padding-block: 34px 40px }
.sa .page + .page { border-top: 2px dashed #c9d3c8 }
.sa h2 { font-family: var(--head); font-weight: 800; font-size: clamp(30px, 5.4vw, 60px); line-height: 1.15; margin: 0 0 22px; text-wrap: balance }
.sa .exhibit { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start }
.sa .model { background: #e2e9df; border-radius: 28px; padding: 3% }
.sa .model.flat { border-radius: 24px; background: var(--card); padding: 12px }
.sa .placard { background: var(--card); border-radius: 6px; padding: 22px 24px; box-shadow: 0 2px 0 #d3dbd0; display: grid; gap: 18px; min-width: 0 }
.sa ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s }
.sa ol.steps li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; font-size: 22px; font-weight: 700; color: #9aa69f; line-height: 1.35 }
.sa ol.steps li::before { content: counter(s); font-family: var(--head); font-weight: 800; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 3px solid currentColor; font-size: 22px }
.sa ol.steps li.now { color: var(--ink) }
.sa ol.steps li.now::before { background: var(--act); border-color: var(--act) }
.sa ol.steps li.done { color: var(--soft) }
.sa .counter { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
.sa .counter b { font-family: var(--head); font-weight: 800; font-size: clamp(40px, 5vw, 56px); font-variant-numeric: tabular-nums; line-height: 1 }
.sa .counter span { font-size: 16px; color: var(--soft) }
.sa .btns { display: flex; gap: 12px; flex-wrap: wrap }
.sa .btn { appearance: none; font: inherit; font-family: var(--head); font-weight: 800; font-size: 20px; padding: 10px 26px; min-height: 52px; border-radius: 999px; border: 0; cursor: pointer; background: var(--act); color: var(--ink); box-shadow: 0 5px 0 var(--act-d) }
.sa .btn:active { box-shadow: 0 1px 0 var(--act-d); transform: translateY(4px) }
.sa .btn.plain { background: transparent; box-shadow: inset 0 0 0 3px var(--ink) }
.sa .btn[disabled] { opacity: .4; cursor: default }
.sa .key { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 17px }
.sa .key span { display: inline-flex; align-items: center; gap: 8px }
.sa .key i { width: 22px; height: 12px; border-radius: 4px; display: inline-block }
.sa .tag { font-weight: 700; white-space: nowrap }
.sa .tag.exp { color: #237a43 } .sa .tag.mod { color: #6447b8 } .sa .tag.sim { color: var(--ink) }
.sa .notes { margin-top: 22px; display: grid; gap: 8px; max-width: 78ch }
.sa .notes p { margin: 0; font-size: 19px }
.sa .fine { font-size: 15px; color: var(--soft); margin: 0 }
.sa .ask p { margin: 0 0 10px; font-size: 22px; font-weight: 700 }
.sa .opt { display: block; width: 100%; text-align: left; margin-bottom: 8px; appearance: none; font: inherit; font-size: 19px; padding: 10px 16px; border-radius: 12px; border: 3px solid #d7dfd4; background: #f6f8f5; cursor: pointer; color: var(--ink) }
.sa .opt.chosen { border-color: var(--act-d); background: #fff4cf }
.sa details.src { margin-top: 18px; font-size: 16px } .sa details.src summary { font-weight: 700; text-decoration: underline; text-underline-offset: 4px }
.sa .demo { font-size: 15px; color: var(--soft); margin: 8px 0 0 }
.sa .ts-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start }

@media (max-width: 800px) { .sa .exhibit, .sa .ts-grid { grid-template-columns: 1fr } .sa .model { border-radius: 28px } .sa ol.steps li { font-size: 20px } }

/* ================= B 交通觀測室：夜間空拍、車燈、時間軸 ================= */
.sb { --night: #131d27; --txt: #e4eaf0; --dim: #93a3b3; --tail: #ff4a3d; --amber: #ffb23f;
  --f: "Chiron Hei HK", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--night); color: var(--txt); font-family: var(--f) }
.sb .page { padding-block: 30px 36px }
.sb .page + .page { border-top: 1px solid #263445 }
.sb h2 { font-weight: 700; font-size: clamp(28px, 4.6vw, 50px); line-height: 1.2; margin: 0 0 6px; color: #fff; text-wrap: balance }
.sb .sub { margin: 0 0 18px; color: var(--dim); font-size: 17px; max-width: 70ch }
.sb .view { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 0 24px; align-items: center }
.sb .view > .stage { width: 100%; max-width: 720px; margin: 0 auto }
.sb .marknote { margin: 4px 0 0 70px; color: var(--dim); font-size: 15px } .sb .marknote i { display: inline-block; width: 3px; height: 14px; background: var(--tail); margin-right: 8px; vertical-align: -2px }
.sb .read { display: grid; gap: 22px; align-content: center; border-left: 1px solid #2b3b4d; padding-left: 20px; min-width: 0 }
.sb .read div { display: grid; gap: 2px }
.sb .read span { color: var(--dim); font-size: 16px }
.sb .read b { font-size: clamp(34px, 4vw, 46px); font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.05 }
.sb .read b.warn { color: var(--tail) }
.sb .axis { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; margin-top: 10px }
.sb .play { appearance: none; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--amber); background: transparent; color: var(--amber); cursor: pointer; display: grid; place-items: center }
.sb .play svg { width: 22px; height: 22px; fill: currentColor }
.sb .track { position: relative; height: 32px }
.sb .track .rail { position: absolute; left: 0; right: 0; top: 14px; height: 4px; background: #2b3b4d; border-radius: 2px }
.sb .track .fill { position: absolute; left: 0; top: 14px; height: 4px; background: var(--amber); border-radius: 2px }
.sb .track .mark { position: absolute; top: 4px; width: 3px; height: 24px; background: var(--tail) }
.sb .caption { margin: 18px 0 0; font-size: clamp(20px, 2.2vw, 24px); color: #fff; min-height: 2.6em; max-width: 60ch }
.sb .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px }
.sb .btn { appearance: none; font: inherit; font-size: 18px; font-weight: 600; padding: 10px 18px; min-height: 48px; border-radius: 4px; border: 1px solid #5b6f84; background: transparent; color: var(--txt); cursor: pointer }
.sb .btn.on { border-color: var(--amber); color: var(--amber) }
.sb .btn[disabled] { opacity: .35; cursor: default }
.sb .tag { white-space: nowrap; font-weight: 600 }
.sb .tag.exp { color: #7fd8a4 } .sb .tag.mod { color: #c8a8ff } .sb .tag.sim { color: #fff }
.sb .notes { margin-top: 20px; display: grid; gap: 6px; color: var(--dim); max-width: 80ch }
.sb .notes p { margin: 0; font-size: 17px }
.sb .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.sb .opt { appearance: none; font: inherit; font-size: 18px; padding: 8px 16px; border-radius: 4px; border: 1px solid #5b6f84; background: transparent; color: var(--txt); cursor: pointer; min-height: 46px }
.sb .opt.chosen { border-color: var(--amber); color: var(--amber) }
.sb details.src { margin-top: 16px; color: var(--dim); font-size: 16px } .sb details.src summary { color: var(--txt); text-decoration: underline; text-underline-offset: 4px }
.sb .ts-view { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 0 24px; align-items: start }
.sb .inset { border-left: 1px solid #2b3b4d; padding-left: 20px; display: grid; gap: 8px; color: var(--dim); font-size: 15px }
@media (max-width: 820px) { .sb .view { grid-template-columns: 1fr } .sb .read { border-left: 0; padding-left: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px } .sb .read b { font-size: 26px } .sb .read span { font-size: 14px } .sb .ts-view { grid-template-columns: 1fr } .sb .inset { border-left: 0; padding-left: 0; width: 60%; margin: 12px auto 0 } .sb .marknote { margin-left: 0 } }

/* ================= C 現代資訊圖鑑：直排標題、圖版、編號注解 ================= */
.sc { --paper: #f7f8fa; --ink: #1c2040; --soft: #4d5372;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  background: var(--paper); color: var(--ink); font-family: var(--cjk) }
.sc .page { padding-block: 34px 40px }
.sc .page + .page { border-top: 8px solid var(--ink) }
.sc .plate { display: grid; grid-template-columns: auto minmax(0, 1.5fr) minmax(0, 1fr); gap: 0 30px; align-items: start }
.sc h2 { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 900; font-size: clamp(40px, 5.2vw, 64px); line-height: 1.15; margin: 0; letter-spacing: .06em; border-right: 6px solid var(--ink); padding-right: 14px; max-height: 760px }
.sc .fig { min-width: 0 }
.sc .figcap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 16px; color: var(--soft); border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 6px }
.sc .side { display: grid; gap: 20px; min-width: 0 }
.sc dl.notes { margin: 0; display: grid; gap: 12px }
.sc dl.notes div { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start }
.sc dl.notes dt { font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1 }
.sc dl.notes dd { margin: 0; font-size: 19px; line-height: 1.5 }
.sc .bignum { font-family: var(--serif); font-weight: 900; font-size: clamp(48px, 6vw, 76px); line-height: 1; font-variant-numeric: tabular-nums }
.sc .numlab { font-size: 16px; color: var(--soft) }
.sc .btns { display: flex; gap: 10px; flex-wrap: wrap }
.sc .btn { appearance: none; font: inherit; font-size: 19px; font-weight: 700; padding: 10px 20px; min-height: 50px; border-radius: 0; border: 3px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer }
.sc .btn.plain { background: transparent; color: var(--ink) }
.sc .btn[disabled] { opacity: .35; cursor: default }
.sc .say { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.45 }
.sc .tag { display: inline-block; padding: 0 6px; border: 2px solid var(--ink); font-weight: 700; white-space: nowrap; line-height: 1.4 }
.sc .tag.exp { background: var(--ink); color: var(--paper) }
.sc .tag.mod { background: transparent }
.sc .tag.sim { background: repeating-linear-gradient(135deg, #d6dae6 0 3px, transparent 3px 7px) }
.sc .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 36px; margin-top: 26px }
.sc .below p { margin: 0; font-size: 18px }
.sc .scale { display: grid; gap: 6px; font-size: 17px }
.sc .scale span { display: flex; align-items: center; gap: 10px }
.sc .scale i { width: 6px; display: inline-block }
.sc .guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: center; font-size: 16px; line-height: 1.35 }
.sc .guide svg { width: 100%; height: auto; border: 2px solid var(--ink); background: #fff; margin-bottom: 4px }
.sc .opt { display: grid; grid-template-columns: 36px 1fr; align-items: center; width: 100%; text-align: left; appearance: none; font: inherit; font-size: 19px; padding: 8px 12px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; margin-bottom: 6px; min-height: 48px }
.sc .opt b { font-family: var(--serif) }
.sc .opt.chosen { background: var(--ink); color: var(--paper) }
.sc details.src { margin-top: 20px; font-size: 16px; border-top: 2px solid var(--ink); padding-top: 10px } .sc details.src summary { font-weight: 700 }
.sc .demo { font-size: 15px; color: var(--soft); margin: 0 }
@media (max-width: 900px) { .sc .plate { grid-template-columns: 1fr } .sc h2 { writing-mode: horizontal-tb; border-right: 0; border-left: 8px solid var(--ink); padding: 0 0 0 12px; margin-bottom: 16px; letter-spacing: 0; font-size: clamp(32px, 9vw, 44px) } .sc .below { grid-template-columns: 1fr } }
</style>

<header class="chrome">
  <h1>幽靈塞車：三種視覺風格樣本</h1>
  <p>三種風格都用同一份示範資料、同樣的文字，放第2頁的環道和第3頁的時空圖。車子的位置是Python參考模型事先算好的一次點擊（點擊後0到400模型時間），還不是正式的瀏覽器模擬。風格還沒選定。</p>
  <div class="tabs" role="tablist" aria-label="選一種風格">
    <button class="tab" role="tab" data-style="a" aria-selected="true">A　互動科學館</button>
    <button class="tab" role="tab" data-style="b" aria-selected="false">B　交通觀測室</button>
    <button class="tab" role="tab" data-style="c" aria-selected="false">C　現代資訊圖鑑</button>
  </div>
</header>
<main id="main"></main>

<script src="sample-data.js"></script>
<script>
(() => {
  const S = window.SAMPLE;
  const N = S.N, L = S.L, B = L / N, VB = S.vb, EV = S.every, FR = S.d.length, SMAX = (FR - 1) * EV;
  const RATE = 6;        // 播放：每秒6個模型時間（逐頁稿第1、2頁的顯示設定）
  const TS_RATE = 16;    // 時空圖：每秒畫16個模型時間
  const JAM_V = 0.1;     // 「幾乎停住」：model/CRITERIA.md的門檻
  const CAR_LEN = 0.3;   // 車子畫的長度（模型長度）。塞車時車距約0.32（Bando 1995），畫短一點才不會看起來重疊
  // 時空圖的時間範圍（顯示設定）：塞車團開始被追蹤（至少3台相鄰的車速度低於0.1）之前50開始，畫110模型時間
  const TS_S0 = Math.max(0, Math.round((S.track[0][0] - 50) / EV) * EV), TS_S1 = Math.min(SMAX, TS_S0 + 110);
  const K0 = Math.round(TS_S0 / EV), K1 = Math.round(TS_S1 / EV);
  const HL = (() => { const k = Math.round(S.track[0][0] / EV); let m = 0; for (let n = 1; n < N; n++) if (S.v[k][n] < S.v[k][m]) m = n; return m; })();
  const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---------- 共用文字（取自pipeline/pages/p02.md、p03.md） ----------
  const T = {
    t2: "輕踩一下煞車，會怎樣？", t3: "車往前開，塞車卻往後跑",
    s1: "點任何一台車，讓它輕輕踩一下煞車", s2: "看後面的車", s3: "找出幾乎停住的地方",
    jam: "你只是讓一台車慢了一下，後面的車卻一台接一台慢下來，最後有一段幾乎停住。",
    time: "模型時間沒有單位，不是秒；動畫已加速。",
    demo: "示範資料：車子的位置是Python參考模型（model/ovm.py）事先算好的一次點擊，還不是正式的瀏覽器模擬。",
    n2sim: "在這組條件下，輕踩煞車造成的小擾動逐漸放大，最後形成塞車。這是這組模擬裡的事，條件不同時，同樣的煞車不一定會塞。",
    n2exp: "真實實驗沒有說是誰踩了煞車，它看到的是車距的小波動自然出現、慢慢變大。",
    one: "每一條線是一台車。往右下斜是在往前開；幾乎直直往下，是幾乎停住了。",
    all: "塞住的地方連成一條帶子。這條帶子往哪邊移？",
    rsim: "帶子往左下斜，跟車子前進的方向相反。車子一台一台從後面開進去、從前面開出來，塞住的位置卻一直往後退。在我們的參考測試裡，車的平均速度是+0.9632，塞車團是−0.1505（沒有單位，不能換成km/h）。",
    rexp: "2008年那個230公尺、22台車的真實環道實驗裡，塞住的那一團車以大約20 km/h往後移。",
    opts: [["right", "往右，跟車子同方向"], ["left", "往左，跟車子反方向"], ["still", "不動"]]
  };
  const SRC2 = [["sim", "ours-model-click-brake"], ["mod", "bando1995-ovm-equation"], ["mod", "bando1995-velocity-function"], ["mod", "bando1995-spontaneous-jam"], ["exp", "sugiyama2008-jam-emerges"]];
  const SRC3 = [["exp", "sugiyama2008-setup"], ["exp", "sugiyama2008-backward-wave"], ["exp", "tadaki2013-density-dependence"], ["mod", "bando1995-spontaneous-jam"], ["sim", "ours-model-wave-direction"]];
  const TAG = { exp: "【實驗】", mod: "【模型】", sim: "【我們的模擬】" };
  const tag = k => `<span class="tag ${k}">${TAG[k]}</span>`;
  const src = l => `<details class="src"><summary>出處：${l.length}張證據卡</summary><ul>${l.map(([k, id]) => `<li>${tag(k)} <code>${id}</code></li>`).join("")}</ul><p style="margin:8px 0 0;font-size:15px">檢查狀態：這是風格樣本，還沒接上檢查報告，所以不顯示任何檢查結果。</p></details>`;

  // ---------- 資料：均勻車流對每台車都一樣，點第j台、在t_c點，就是把資料轉j格、平移V(b)·t_c ----------
  let st, tsx, styleKey = "a", root = null, raf = 0, last = 0;

    c: () => `

  // ---------- 畫面更新 ----------
  function drawP2() {
    const cv = root.querySelector('[data-ring="2"]'); if (!cv) return;
    const { ctx, w } = fit(cv, w => w), cars = Array.from({ length: N }, (_, n) => carAt(n, st.s));
    const sl = slowest(cars), jam = !!st.click && cars[sl].v < JAM_V;
    RINGS[styleKey](ctx, w, cars, st.click ? st.click.j : null, { selLabel: !!st.click && (styleKey === "c" || st.s < 40), jam: jam ? sl : null });
    const say = root.querySelector("[data-say]"), step = !st.click ? 1 : jam ? 3 : 2;
    if (say) say.textContent = st.done ? "示範資料到此為止（點擊後400模型時間）。按「重來」可以點別台車。" : !st.click ? (styleKey === "a" ? "" : T.s1 + "。") : jam ? T.jam : st.s < .5 ? "煞車中。" : T.s2 + "：慢下來的地方會往後傳。";
    root.querySelectorAll("[data-step]").forEach(li => { const k = +li.dataset.step; li.className = k === step ? "now" : k < step ? "done" : ""; });
    root.querySelectorAll("[data-clock]").forEach(e => e.textContent = nowT().toFixed(1));
    const mv = root.querySelector("[data-minv]"); if (mv) { mv.textContent = cars[sl].v.toFixed(2); mv.classList.toggle("warn", cars[sl].v < JAM_V); }
    const ns = root.querySelector("[data-nstop]"); if (ns) { const k = cars.filter(c => c.v < JAM_V).length; ns.textContent = k + "台"; ns.classList.toggle("warn", k > 0); }
    const fl = root.querySelector("[data-fill]"); if (fl) fl.style.width = (st.click ? st.s / SMAX * 100 : 0) + "%";
  }
  function drawP3Ring() {
    const cv = root.querySelector('[data-ring="3"]'); if (!cv) return;
    const { ctx, w } = fit(cv, w => w);
    if (!st.click || tsx.mode === "idle") { RINGS[styleKey](ctx, w, Array.from({ length: N }, (_, n) => ({ x: n * B, v: VB })), null, { legend: false }); return; }
    const s = tsx.mode === "one" ? tsx.prog : tsx.loop;
    RINGS[styleKey](ctx, w, Array.from({ length: N }, (_, n) => carAt(n, s)), (HL + st.click.j) % N, { selLabel: false, legend: false });
  }
  function resetTs() {
    const one = root.querySelector('[data-act="ts-one"]'), all = root.querySelector('[data-act="ts-all"]');
    one.disabled = false; all.disabled = true;
    root.querySelector("[data-ask]").classList.add("hide"); root.querySelector("[data-reveal]").classList.add("hide");
    root.querySelectorAll("[data-opt]").forEach(b => { b.disabled = false; b.classList.remove("chosen"); });
    root.querySelector("[data-ts-say]").textContent = T.one; root.querySelector("[data-auto]").textContent = "";
  }
  function setPauseLabel() {
    root.querySelectorAll('[data-act="pause"]').forEach(b => { const ic = b.querySelector("[data-icon]");
      if (ic) { b.setAttribute("aria-label", st.playing ? "暫停" : "播放"); ic.innerHTML = st.playing ? '<rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/>' : '<path d="M6 4 L20 12 L6 20 Z"/>'; }
      else b.textContent = st.playing ? "暫停" : "播放"; });
  }
  function tick(ms) {
    const dt = last ? Math.min(.1, (ms - last) / 1000) : 0; last = ms;
    if (st.playing) { if (!st.click) st.t += RATE * dt; else if (!st.done) { st.s += RATE * dt; if (st.s >= SMAX) { st.s = SMAX; st.done = true; } } }
    if (tsx.mode === "one" && !tsx.ended) { tsx.prog += TS_RATE * dt; tsx.dirty = true; if (tsx.prog >= TS_S1) { tsx.prog = TS_S1; tsx.ended = true; root.querySelector('[data-act="ts-all"]').disabled = false; } }
    else if ((tsx.mode === "all" || tsx.mode === "reveal") && !reduce) { tsx.loop += TS_RATE * dt * .5; if (tsx.loop > TS_S1) tsx.loop = TS_S0; }
    drawP2(); drawP3Ring(); if (tsx.dirty) { tsDraw(); tsx.dirty = false; }
    raf = requestAnimationFrame(tick);
  }
  function click(n) { st.click = { j: n, tc: st.t }; st.s = 0; st.done = false; st.playing = true; setPauseLabel(); tsx = { mode: "idle", prog: TS_S0, loop: TS_S0, ended: false, dirty: true }; resetTs(); }
  function onRing(ev) {
    if (st.click) return;
    const r = ev.currentTarget.getBoundingClientRect(), x = ev.clientX - r.left - r.width / 2, y = ev.clientY - r.top - r.height / 2;
    let a = Math.atan2(x, -y); if (a < 0) a += 2 * Math.PI;
    const xs = a / (2 * Math.PI) * L; let best = 0, bd = 1e9;
    for (let n = 0; n < N; n++) { let d = Math.abs(mod(carAt(n, 0).x) - xs); d = Math.min(d, L - d); if (d < bd) { bd = d; best = n; } }
    click(best);
  }

  function mount(key) {
    styleKey = key; cancelAnimationFrame(raf); last = 0; fresh();
    const main = document.getElementById("main");
    main.innerHTML = `<div class="s${key}">${TPL[key]()}</div>`; root = main.firstElementChild;
    const c2 = root.querySelector('[data-ring="2"]');
    c2.addEventListener("click", onRing);
    c2.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !st.click) { e.preventDefault(); click(0); } });
    root.addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      const act = b.dataset.act, opt = b.dataset.opt;
      if (act === "pause") { st.playing = !st.playing; setPauseLabel(); }
      if (act === "reset") { fresh(); st.playing = true; setPauseLabel(); resetTs(); }
      if (act === "ts-one") { if (!st.click) { click(0); root.querySelector("[data-auto]").textContent = "第2頁還沒點車，這次由我們替你點了一台車（第0台）。"; }
        tsx.mode = "one"; tsx.prog = TS_S0; tsx.ended = false; tsx.dirty = true; b.disabled = true; }
      if (act === "ts-all") { tsx.mode = "all"; tsx.dirty = true; b.disabled = true; root.querySelector("[data-ask]").classList.remove("hide"); root.querySelector("[data-ts-say]").textContent = "現在22台車都畫上去了。"; }
      if (opt) { root.querySelectorAll("[data-opt]").forEach(x => { x.disabled = true; x.classList.toggle("chosen", x === b); });
        root.querySelector("[data-ts-say]").textContent = opt === "left" ? "對，往左。" : "再看一次：帶子往左下斜。";
        tsx.mode = "reveal"; tsx.dirty = true; root.querySelector("[data-reveal]").classList.remove("hide"); }
    });
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.style === key)));
    setPauseLabel(); tsDraw();
    raf = requestAnimationFrame(tick);
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { if (location.hash === "#" + t.dataset.style) mount(t.dataset.style); else location.hash = t.dataset.style; }));
  const route = () => { const k = (location.hash || "#a").slice(1); mount(TPL[k] ? k : "a"); };
  window.addEventListener("hashchange", route);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (tsx) tsx.dirty = true; }, 100); });
  route();
})();
</script>
